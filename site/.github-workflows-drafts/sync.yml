# UTKAST — flyttes til .github/workflows/sync.yml når siden får eget repo.
#
# Nattlig datasynk: henter tall fra GitHub og npm, committer
# site/src/data/generated.json. Pages-deployen (deploy.yml) trigges
# av pushen. Jobben feiler høylytt hvis en delhenting feiler (PRD §7).

name: Nattlig datasynk

on:
  schedule:
    - cron: "28 3 * * *" # 05.28 norsk sommertid — utenom rushtid på API-ene
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Installer avhengigheter
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Hent data fra GitHub og npm
        working-directory: site
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit oppdatert generated.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/generated.json
          if git diff --cached --quiet; then
            echo "Ingen endringer i data."
          else
            git commit -m "chore: nattlig datasynk"
            git push
          fi

      # PRD §7: nightly-jobben skal feile høylytt. Koble på Slack-varsel
      # (f.eks. slackapi/slack-github-action) med webhook når kanalen er avklart.

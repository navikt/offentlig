  - repo: navikt/nav-faker
    kategori: biblioteker
    beskrivelse: >-
      TypeScript-bibliotek som genererer norske testdata —
      fødselsnummer, navn, adresser, tall og datoer.
    perle: false

  - repo: nais/texas
    kategori: plattform

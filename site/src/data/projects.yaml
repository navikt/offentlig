# projects.yaml — det kuraterte utvalget
#
# Redaksjonelt innhold: repo-slug, kategori og en håndskrevet norsk
# beskrivelse (aldri GitHub-beskrivelsen). Endres via pull request.
# Tall (stjerner, språk, sist aktiv, arkivstatus) hentes automatisk
# av scripts/sync.mjs hver natt — aldri et håndvedlikeholdt tall.
#
# Kategorier: plattform · designsystem · biblioteker · aapenhet · data-ki
# perle: true løfter prosjektet inn i «Skjulte perler»-seksjonen
# (og krever da kicker + meta i tillegg).
#
# team: (valgfritt) vises som «Vedlikeholdes av …» på kortet (PRD §5.5).
# Feltet står tomt til det er forankret med eierteamene (PRD §9 pkt. 4) —
# aldri gjett et teamnavn.
#
# side: (valgfritt) prosjektets landingsside. Relativ sti («prosjekt/navn»)
# peker på en håndlaget side under src/pages/ (alltid bespoke — aldri
# generert fra en mal); full URL peker på en eksisterende side utenfor
# showcasen. Gjenbrukslisten lenker hit i stedet for til GitHub.
#
# gjenbruk: (valgfritt) løfter prosjektet inn i «Bygd for gjenbruk»-seksjonen
# (PRD §4.4). Selv et tomt objekt ({}) er nok til å bli med. Valgfrie felt:
#   bruktAv: liste med navngitte virksomheter utenfor Nav som bruker prosjektet.
#           KUN håndverifiserte påstander — aldri gjett en adopter (PRD §7).
#           Endres via pull request. Rendres som «Brukt av X (og Y)».
#   merknad: fritekst når vi ikke kan navngi noen konkret adopter,
#           f.eks. «Brukt langt utenfor Nav». Vises kun når bruktAv mangler.
#
# Plassholderen {{fnrNedlastinger}} byttes ved bygg ut med ferske npm-tall
# fra generated.json (stats.fnrDownloadsLastMonth) — aldri et håndskrevet tall.
# Gjelder kun perle-tekster (Gems.astro); landingssider leser generated.json direkte.

projects:
  - repo: navikt/mock-oauth2-server
    kategori: biblioteker
    beskrivelse: >-
      Mock av OAuth2 og OpenID Connect
      til testing — brukt langt utenfor Nav.
    perle: false
    side: prosjekt/mock-oauth2-server
    gjenbruk:
      merknad: Brukt langt utenfor Nav

  - repo: navikt/aksel
    kategori: designsystem
    beskrivelse: Designsystemet bak nav.no — komponenter, tokens og over 900 ikoner.
    perle: false

  - repo: nais/naiserator
    kategori: plattform
    beskrivelse: Én applikasjonsspesifikasjon inn, komplett Kubernetes-oppsett ut.
    perle: false

  - repo: navikt/helse-spleis
    kategori: aapenhet
    beskrivelse: «En liten kalkulator for sykepenger» — selve beregningsmotoren, åpen for innsyn.
    perle: false

  - repo: navikt/cplt
    kategori: data-ki
    beskrivelse: Sandkasse på kjernenivå som holder KI-kodeagenter i tømmene.
    perle: false
    side: https://ki-utvikling.nav.no/cplt
    gjenbruk: {}

  - repo: navikt/pdfgen
    kategori: biblioteker
    beskrivelse: HTML-mal inn, PDF ut. Har generert Navs dokumenter siden 2018.
    perle: false
    side: prosjekt/pdfgen
    gjenbruk: {}

  - repo: nais/wonderwall
    kategori: plattform
    beskrivelse: Sidecar som tar seg av all pålogging, så applikasjonene slipper.
    perle: false
    side: prosjekt/wonderwall
    gjenbruk: {}

  - repo: navikt/rapids-and-rivers
    kategori: biblioteker
    beskrivelse: Kafka-bibliotek for hendelsesdrevne tjenester etter rapids/rivers-mønsteret.
    perle: false

  - repo: navikt/token-support
    kategori: biblioteker
    beskrivelse: OAuth2- og OIDC-validering for JVM-apper, rett fra Maven Central.
    perle: false
    side: prosjekt/token-support
    gjenbruk: {}

  - repo: navikt/fnrvalidator
    kategori: biblioteker
    perle: false
    beskrivelse: >-
      Validerer fødselsnummer og d-nummer — den stille standarden
      i norsk JavaScript.
    side: prosjekt/fnrvalidator
    gjenbruk:
      merknad: Også utenfor forvaltningen

  - repo: nais/digdirator
    kategori: plattform
    perle: false
    beskrivelse: >-
      Kubernetes-operator som registrerer klienter mot ID-porten og
      Maskinporten automatisk.
    side: prosjekt/digdirator
    gjenbruk:
      merknad: Klar for enhver norsk etat

  - repo: navikt/DSF
    kategori: aapenhet
    perle: true
    kicker: Historisk dokument
    beskrivelse: >-
      Det sentrale folketrygdsystemet kjørte fra 1967 til 2018. Da
      IT-dinosauren gikk av med pensjon, la vi den ut — i PL/I, som den ble
      skrevet.
    meta: PL/I · 1967–2018

  - repo: navikt/ghep
    kategori: biblioteker
    beskrivelse: >-
      Hendelser fra GitHub rett inn i Slack — issues, pull requests
      og deploys der teamet er.
    perle: false
    side: https://navikt.github.io/ghep/
    gjenbruk:
      bruktAv:

    perle: false
    side: prosjekt/kafkarator
    gjenbruk: {}

  - repo: nais/bqrator
    kategori: plattform
    beskrivelse: Kubernetes-operator som oppretter BigQuery-datasett deklarativt.
    perle: false
    side: prosjekt/bqrator
    gjenbruk: {}
